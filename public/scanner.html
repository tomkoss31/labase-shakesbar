<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>La Base — Scanner comptoir</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
  /* ── Thème CLAIR (aligné sur l'appli client) ── */
  :root {
    color-scheme: light;
    --bg: #f3f8f6;          /* fond de page + champs / cases (effet « creusé ») */
    --card: #ffffff;
    --card2: #f7fbfa;
    --line: rgba(13,148,136,.18);
    --text: #0b2622;
    --dim: #48695f;
    --faint: #5b6b68;
    --disabled: #5f736e;    /* cadeaux verrouillés : lisibles, signalés par 🔒 */
    --teal: #0f766e;        /* bordures, boutons, cases à cocher */
    --teal-text: #0f766e;   /* textes teal (≥ 4,5:1 sur blanc) */
    --amber: #f59e0b;       /* fonds de boutons */
    --amber-text: #9a4a06;  /* textes ambre lisibles sur blanc (même sur fond ambre pâle) */
    --rose: #be123c;
    --green-text: #166534;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    min-height: 100vh;
  }
  h1 {
    font-family: 'Outfit', sans-serif;
    font-weight: 900;
    font-size: 28px;
    letter-spacing: -0.02em;
    margin: 4px 0 4px;
    background: linear-gradient(135deg, #0f766e, #0d9488, #d97706);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .sub { color: var(--dim); font-size: 13px; margin-bottom: 16px; }
  .container { max-width: 980px; margin: 0 auto; }
  /* Tablette (iPad 10") : on prend la largeur — 2 colonnes au lieu du format iPhone. */
  .top-grid { display: flex; flex-direction: column; }
  @media (min-width: 760px) {
    .top-grid { display: grid; grid-template-columns: 300px 1fr; gap: 14px; align-items: start; }
    #result { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: start; }
    #result > .scan-client-card { grid-column: 1 / -1; }
    #result > .credit-banner { grid-column: 1 / -1; }
    video { max-height: 520px; }
    h1 { font-size: 34px; }
  }
  .card {
    background: linear-gradient(135deg, var(--card), var(--card2));
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: 0 1px 2px rgba(11,38,34,.05), 0 8px 24px rgba(11,38,34,.06);
  }
  input {
    width: 100%;
    padding: 12px 14px;
    background: var(--bg);
    border: 1px solid rgba(13,148,136,.18);
    border-radius: 10px;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    outline: none;
  }
  label {
    display: block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .08em;
    color: var(--dim);
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .btn {
    width: 100%;
    padding: 14px;
    background: var(--amber);
    color: #1a0f00;
    border: 0;
    border-radius: 12px;
    font-family: 'Outfit', sans-serif;
    font-weight: 800;
    font-size: 14px;
    cursor: pointer;
  }
  .btn-teal { background: var(--teal); color: #ffffff; }
  .btn-secondary { background: transparent; color: var(--text); border: 1px solid rgba(13,148,136,.28); }
  video {
    width: 100%;
    max-height: 360px;
    border-radius: 12px;
    background: #000;
  }
  .scanner-zone {
    position: relative;
    border: 2px dashed rgba(13,148,136,.38);
    border-radius: 14px;
    overflow: hidden;
  }
  .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 12px; }
  .stat { background: var(--bg); padding: 12px; border-radius: 10px; border: 1px solid rgba(13,148,136,.18); }
  .stat-label { font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: .08em; }
  .stat-value { font-family: 'Outfit'; font-weight: 900; font-size: 20px; color: var(--amber-text); margin-top: 2px; }
  .reward-pill {
    display: inline-block;
    padding: 4px 10px;
    background: var(--rose)22;
    color: var(--rose);
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    margin: 2px 4px 2px 0;
  }
  .unlock-credit {
    width: 100%; margin-bottom: 12px; padding: 13px 14px; border-radius: 12px;
    border: 1.5px dashed var(--teal); background: transparent; color: var(--teal-text);
    font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 14px; cursor: pointer;
  }
  .ok { background: rgba(13,148,136,.15); color: var(--teal-text); padding: 10px 14px; border-radius: 10px; border: 1px solid var(--teal); font-size: 13px; }
  .err { background: rgba(251,113,133,.15); color: var(--rose); padding: 10px 14px; border-radius: 10px; border: 1px solid var(--rose); font-size: 13px; }
</style>
</head>
<body>
<div class="container">
  <h1>📷 Scanner comptoir</h1>
  <div class="sub">Scanne le QR du client pour voir ses XP et créditer une commande Square en caisse.</div>

  <div class="top-grid">
  <div class="card">
    <label>Mot de passe admin</label>
    <input type="password" id="password" placeholder="ADMIN_PUSH_PASSWORD" autocomplete="current-password" />
  </div>

  <div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 8px;">
      <label style="margin-bottom: 0;" id="camLabel">📷 Caméra</label>
      <div style="display: flex; gap: 8px;">
        <button class="btn-secondary" id="flipCam" style="padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer;" title="Basculer avant / arrière">🔄 Avant/Arrière</button>
        <button class="btn-secondary" id="toggleCam" style="padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer;">Démarrer</button>
      </div>
    </div>
    <div class="scanner-zone" id="scannerZone" style="display: none;">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="canvas" style="display: none;"></canvas>
    </div>
    <div style="margin-top: 10px;">
      <label>Ou colle un ID manuellement</label>
      <input type="text" id="manualId" placeholder="UUID utilisateur ou code CASH-XXXX" />
      <button class="btn" id="manualLookup" style="margin-top: 8px;">Rechercher</button>
    </div>
  </div>
  </div>

  <div id="result"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  // Échappe tout texte venant d'un client / du serveur avant insertion HTML (anti-XSS).
  const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const STORAGE_KEY = 'labase-scanner-token';

  try {
    const saved = sessionStorage.getItem(STORAGE_KEY);
    if (saved) $('password').value = saved;
  } catch {}

  let stream = null;
  let scanning = false;
  let lastScanned = '';
  let lastScannedAt = 0;
  // Dernier encaissement fait depuis cet écran (message vert + anti-doublon)
  let lastCredit = null;

  // Caméra avant (client, ex: iPad posé dans le socle Square) ou arrière (téléphone).
  // Mémorisé par appareil : l'iPad du comptoir garde "avant", ton tel garde "arrière".
  const FACING_KEY = 'labase-scanner-facing';
  let currentFacing = 'environment';
  try { currentFacing = localStorage.getItem(FACING_KEY) || 'environment'; } catch {}

  function updateCamLabel() {
    $('camLabel').textContent = currentFacing === 'user'
      ? '📷 Caméra avant (face au client)'
      : '📷 Caméra arrière';
    // Miroir visuel pour la caméra avant (n'affecte pas le décodage, qui lit l'image brute)
    $('video').style.transform = currentFacing === 'user' ? 'scaleX(-1)' : 'none';
  }
  updateCamLabel();

  async function startCamera() {
    try {
      if (stream) stream.getTracks().forEach((t) => t.stop());
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: currentFacing },
        audio: false,
      });
      const video = $('video');
      video.srcObject = stream;
      $('scannerZone').style.display = 'block';
      $('toggleCam').textContent = 'Arrêter';
      scanning = true;
      scanLoop();
    } catch (err) {
      showResult('err', '❌ Accès caméra refusé : ' + esc(err.message));
    }
  }

  // Bascule avant/arrière (redémarre le flux si la caméra tourne déjà)
  $('flipCam').addEventListener('click', async () => {
    currentFacing = currentFacing === 'user' ? 'environment' : 'user';
    try { localStorage.setItem(FACING_KEY, currentFacing); } catch {}
    updateCamLabel();
    if (stream) { await startCamera(); }
  });

  function stopCamera() {
    if (stream) stream.getTracks().forEach((t) => t.stop());
    stream = null;
    scanning = false;
    $('scannerZone').style.display = 'none';
    $('toggleCam').textContent = 'Démarrer';
  }

  $('toggleCam').addEventListener('click', () => {
    if (stream) stopCamera();
    else startCamera();
  });

  function scanLoop() {
    if (!scanning) return;
    const video = $('video');
    const canvas = $('canvas');
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = window.jsQR(imageData.data, canvas.width, canvas.height);
      if (code && code.data) {
        const now = Date.now();
        if (code.data !== lastScanned || now - lastScannedAt > 3000) {
          lastScanned = code.data;
          lastScannedAt = now;
          handleScanned(code.data);
        }
      }
    }
    requestAnimationFrame(scanLoop);
  }

  function handleScanned(text) {
    if (text.startsWith('LABASE-USER:')) {
      const userId = text.replace('LABASE-USER:', '');
      lookupUser(userId);
    } else if (text.startsWith('LABASE-CASH:')) {
      const code = text.replace('LABASE-CASH:', '');
      showResult('ok', '💵 Code commande espèces : <b>' + esc(code.slice(0, 40)) + '</b> — va sur <a href="/comptoir.html" style="color:var(--teal-text)">/comptoir.html</a> pour encaisser.');
    } else {
      showResult('err', 'QR non reconnu : ' + esc(text.slice(0, 40)));
    }
  }

  $('manualLookup').addEventListener('click', () => {
    const id = $('manualId').value.trim();
    if (!id) return;
    if (id.startsWith('CASH-')) {
      showResult('ok', '💵 Code commande espèces. Va sur <a href="/comptoir.html" style="color:var(--teal-text)">/comptoir.html</a>.');
    } else {
      lookupUser(id);
    }
  });

  async function lookupUser(userId) {
    const password = $('password').value.trim();
    if (!password) {
      showResult('err', 'Mot de passe requis');
      return;
    }
    sessionStorage.setItem(STORAGE_KEY, password);
    try {
      const resp = await fetch('/api/profile?action=lookup&id=' + encodeURIComponent(userId), {
        headers: { 'Authorization': 'Bearer ' + password },
      });
      const data = await resp.json();
      if (!resp.ok) {
        showResult('err', '❌ ' + esc(data.error || 'Erreur'));
        return;
      }
      renderProfile(data.profile, data.rewards, data.recentOrder);
    } catch (err) {
      showResult('err', '❌ ' + esc(err.message));
    }
  }

  // Détail visuel d'une remise/cadeau selon son type (comme dans l'app).
  function rewardMeta(r) {
    if (r.reward_type === 'discount_percent') return { icon: '💸', big: '−' + r.reward_value + '%', sub: 'Remise à appliquer sur la tablette Square' };
    if (r.reward_type === 'free_product') return { icon: '🥤', big: (r.reward_value || r.reward_label), sub: 'Produit OFFERT à donner' };
    if (r.reward_type === 'manual_pickup') return { icon: '🎁', big: r.reward_label, sub: 'Cadeau à remettre au comptoir' };
    if (r.reward_type === 'xp_multiplier') return { icon: '🚀', big: 'XP ×' + r.reward_value, sub: 'Automatique — rien à faire' };
    return { icon: '🎁', big: r.reward_label, sub: '' };
  }

  function renderProfile(p, rewards, recentOrder) {
    const name = p.first_name || '(prénom non renseigné)';
    const total = (p.total_spent_cents / 100).toFixed(2).replace('.', ',');
    const active = rewards || [];

    // ⚠️ Garde-fou anti-doublon : le client a déjà été crédité récemment.
    let warnBlock = '';
    if (recentOrder) {
      const eur = (recentOrder.total_cents / 100).toFixed(2).replace('.', ',');
      warnBlock =
        '<div class="credit-banner" style="margin:0 0 14px;padding:13px 15px;background:rgba(251,113,133,.16);border:2px solid var(--rose);border-radius:14px;">' +
          '<div style="font-family:Outfit;font-weight:900;color:var(--rose);font-size:15px;">⚠️ Déjà crédité il y a ' + recentOrder.minutes_ago + ' min</div>' +
          '<div style="font-size:13px;color:var(--text);margin-top:4px;line-height:1.4;">Ce client a déjà eu ses XP pour une commande de <b>' + eur + '€</b>. Si c\'est le <b>même achat</b> (ex. payé en carte + commande espèces dans l\'app), <b>ne recrédite PAS</b> — ce serait un doublon.</div>' +
        '</div>';
    }

    // ✅ Encaissement fait À L'INSTANT depuis cet écran : message vert (et non
    // l'alerte rouge « déjà crédité », qui voyait le passage qu'on vient de faire).
    const jc = lastCredit && lastCredit.userId === p.id && Date.now() - lastCredit.at < 10 * 60 * 1000 ? lastCredit : null;
    if (jc) {
      const jcEur = (jc.amountCents / 100).toFixed(2).replace('.', ',');
      warnBlock =
        '<div class="credit-banner" style="margin:0 0 14px;padding:13px 15px;background:rgba(22,101,52,.09);border:2px solid var(--green-text);border-radius:14px;">' +
          '<div style="font-family:Outfit;font-weight:900;color:var(--green-text);font-size:16px;">✅ Crédité à l\'instant : +' + jc.xpGained + ' XP</div>' +
          '<div style="font-size:13px;color:var(--text);margin-top:4px;line-height:1.4;">Passage de <b>' + jcEur + ' €</b> enregistré. Nouveau total : <b>' + jc.newXp + ' XP</b>. C\'est tout bon, tu peux passer au client suivant.</div>' +
        '</div>';
    }
    // Déjà crédité (à l'instant ou récemment) → formulaire replié derrière un
    // bouton : impossible de recréditer le même passage par réflexe.
    const lockCredit = !!(jc || recentOrder);
    const unlockBtn = lockCredit
      ? '<button type="button" id="unlockCredit" class="unlock-credit">➕ Autre achat pour ce client : créditer un nouveau passage</button>'
      : '';

    // Remises/cadeaux SÉLECTIONNABLES : celui coché est marqué "utilisé"
    // atomiquement à l'encaissement (credit-manual → wheelSpinId).
    let rewardsBlock = '';
    if (active.length) {
      rewardsBlock =
        '<div style="margin: 2px 0 12px;">' +
        '<div class="stat-label" style="margin-bottom: 8px; color: var(--amber-text);">🎟️ REMISES / CADEAUX ACTIFS — coche celle que tu appliques</div>' +
        active.map((r) => {
          const m = rewardMeta(r);
          const exp = r.expires_at ? new Date(r.expires_at).toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' }) : '';
          return (
            '<label style="display:flex; align-items:center; gap:12px; padding:12px; border:1px solid rgba(245,158,11,.35); border-radius:12px; margin-bottom:8px; cursor:pointer; background:var(--bg);">' +
              '<input type="radio" name="applyReward" value="' + esc(r.id) + '" style="width:22px; height:22px; flex:none; accent-color:var(--amber);" />' +
              '<span style="font-size:26px;">' + m.icon + '</span>' +
              '<span style="flex:1; min-width:0;">' +
                '<span style="font-family:Outfit; font-weight:900; font-size:22px; color: var(--amber-text);">' + esc(m.big) + '</span>' +
                '<span style="display:block; font-size:12px; color:var(--text); margin-top:1px;">' + esc(r.reward_label) + '</span>' +
                '<span style="display:block; font-size:10.5px; color:var(--dim);">' + m.sub + (exp ? ' · exp. ' + exp : '') + ' · ' + esc(r.reward_code) + '</span>' +
              '</span>' +
            '</label>'
          );
        }).join('') +
        '<label style="display:flex; align-items:center; gap:12px; padding:8px 12px; cursor:pointer;">' +
          '<input type="radio" name="applyReward" value="" checked style="width:22px; height:22px; flex:none; accent-color:var(--dim);" />' +
          '<span style="font-size:13px; color:var(--dim);">Aucune remise sur cette commande</span>' +
        '</label>' +
        '</div>';
    }

    // Catalogue cadeaux (déduit les XP) — SYNCHRO console.html / catalog.ts
    const CATALOG = [
      { id: 'extra', cost: 750, minOrders: 0, emoji: '✨', title: 'Un extra offert' },
      { id: 'boisson', cost: 1500, minOrders: 3, emoji: '🥤', title: 'Boisson energy ou smoothie' },
      { id: 'combo-gaufre', cost: 2200, minOrders: 6, emoji: '🧇', title: 'Boisson + gaufre' },
      { id: 'cadeau-mois', cost: 3800, minOrders: 10, emoji: '🎁', title: 'Cadeau du mois' },
    ];
    const giftButtons = CATALOG.map((c) => {
      const ok = p.xp >= c.cost;
      // XP suffisants mais pas assez d'ACHATS au bar : bouton actif avec avertissement
      // (confirmation avant d'offrir quand même — le serveur refuse sans force).
      const orders = Number(p.total_orders) || 0;
      const short = ok && orders < c.minOrders;
      const tag = short ? '⚠️ ' + orders + '/' + c.minOrders + ' achats' : (ok ? 'Donner · −' + c.cost + ' XP' : '🔒 ' + c.cost + ' XP');
      return '<button class="gift-btn" data-rid="' + c.id + '" data-cost="' + c.cost + '" data-label="' + c.title + '"' + (ok ? '' : ' disabled') +
        ' style="display:flex;align-items:center;gap:10px;width:100%;margin-top:8px;padding:13px 14px;border-radius:12px;border:1px solid ' +
        (ok ? 'var(--teal)' : 'rgba(13,148,136,.20)') + ';background:' + (ok ? 'rgba(13,148,136,.12)' : 'var(--bg)') +
        ';color:' + (ok ? 'var(--text)' : 'var(--disabled)') + ';font-family:inherit;font-size:14px;font-weight:700;cursor:' +
        (ok ? 'pointer' : 'not-allowed') + ';text-align:left;">' +
        '<span style="font-size:22px;">' + c.emoji + '</span>' +
        '<span style="flex:1;">' + c.title + '</span>' +
        '<span style="font-weight:800;color:' + (short ? 'var(--amber-text)' : ok ? 'var(--teal-text)' : 'var(--disabled)') + ';">' + tag + '</span></button>';
    }).join('');

    $('result').innerHTML =
      warnBlock +
      '<div class="card scan-client-card" style="border-color: var(--teal);">' +
        '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">' +
          '<div style="min-width:0;">' +
            '<div style="font-size: 11px; color: var(--teal-text); font-weight: 700; letter-spacing: .08em; text-transform: uppercase;">CLIENT IDENTIFIÉ</div>' +
            '<div style="font-family: Outfit; font-weight: 900; font-size: 24px; margin-top: 4px;">' + esc(name) + '</div>' +
            '<div style="font-size: 12px; color: var(--dim); margin-top: 2px;">' + esc(p.email || 'Email inconnu') + '</div>' +
          '</div>' +
          '<button id="historyBtn" class="btn-secondary" style="padding:9px 12px;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;flex:none;">🧾 Historique</button>' +
        '</div>' +
        '<div class="stats">' +
          '<div class="stat"><div class="stat-label">XP</div><div class="stat-value">' + esc(p.xp) + '</div></div>' +
          '<div class="stat"><div class="stat-label">Tier VIP</div><div class="stat-value" style="font-size: 16px;">' + esc(p.vip_tier) + '</div></div>' +
          '<div class="stat"><div class="stat-label">Commandes</div><div class="stat-value">' + esc(p.total_orders) + '</div></div>' +
          '<div class="stat"><div class="stat-label">Total dépensé</div><div class="stat-value">' + total + '€</div></div>' +
        '</div>' +
        '<div id="history-box"></div>' +
      '</div>' +
      unlockBtn +
      '<div class="card" id="creditCard"' + (lockCredit ? ' style="display:none;"' : '') + '>' +
        '<label>💳 Encaissement Square caisse + crédit XP</label>' +
        rewardsBlock +
        (active.length ? '<div style="font-size:11.5px; color: var(--amber-text); background:rgba(245,158,11,.1); border:1px solid rgba(245,158,11,.3); border-radius:8px; padding:8px 10px; margin-bottom:10px; line-height:1.45;">⚠️ Applique la remise <b>sur la tablette Square</b> d\'abord, PUIS coche-la ici → marquée utilisée.</div>' : '') +
        '<input type="number" id="amount" placeholder="Montant encaissé en € (ex: 8.90)" step="0.10" min="0" />' +
        '<label style="display:flex;align-items:center;gap:8px;margin-top:10px;cursor:pointer;font-size:13px;text-transform:none;letter-spacing:0;color:var(--text);">' +
          '<input type="checkbox" id="comboCheck" style="width:18px;height:18px;accent-color:var(--teal);" />' +
          '⚡ Commande combo (boisson + smoothie) <b style="color:var(--teal-text);">+25 XP</b>' +
        '</label>' +
        '<input type="text" id="saleNote" placeholder="Détail vente (ex: 2 smoothies + gaufre) — optionnel" maxlength="120" style="margin-top:10px;" />' +
        '<button class="btn btn-teal" id="creditBtn" style="margin-top: 10px;">✓ Encaisser & créditer XP</button>' +
        '<div style="font-size: 11px; color: var(--dim); margin-top: 8px; line-height: 1.5;">Montant encaissé sur Square. XP auto : 10 XP/€ + 50 XP/cmd (+25 combo, ×2 mardi). La remise cochée est marquée utilisée.</div>' +
      '</div>' +
      '<div class="card">' +
        '<label>🎁 Offrir un cadeau (déduit les XP)</label>' +
        '<div style="font-size:11px;color:var(--dim);margin:4px 0 2px;">Le client réclame un cadeau ? Clique pour déduire ses XP.</div>' +
        giftButtons +
      '</div>' +
      '<div class="card" style="border-color:rgba(13,148,136,.33);">' +
        '<label>📋 Migration carte fidélité papier</label>' +
        '<div style="font-size:11px;color:var(--dim);margin:4px 0 8px;line-height:1.45;">Client qui passait par la carte papier ? Ajoute ses points en XP ici. Ne touche pas au CA ni au nombre de commandes.</div>' +
        '<input type="number" id="manualXp" placeholder="XP à créditer (ex: 230)" step="1" min="1" max="100000" />' +
        '<input type="text" id="manualReason" placeholder="Raison (ex: Carte papier — 230 points)" maxlength="280" style="margin-top:8px;" />' +
        '<button class="btn btn-teal" id="manualXpBtn" style="margin-top:10px;">📋 Créditer XP manuellement</button>' +
      '</div>';

    $('creditBtn').addEventListener('click', () => creditXP(p.id));
    const unlock = $('unlockCredit');
    if (unlock) unlock.addEventListener('click', () => {
      $('creditCard').style.display = '';
      unlock.remove();
      if ($('amount')) $('amount').focus();
    });
    $('manualXpBtn').addEventListener('click', () => creditXpManual(p.id));
    $('historyBtn').addEventListener('click', () => showClientHistory(p.id));
    document.querySelectorAll('.gift-btn').forEach((btn) => {
      if (btn.disabled) return;
      btn.addEventListener('click', () => redeemReward(p.id, btn.dataset.rid, btn.dataset.label, btn.dataset.cost));
    });
  }

  // ─── Offrir un cadeau (déduit les XP) ─────────────────────────────
  async function redeemReward(userId, rewardId, label, cost, force = false) {
    if (!force && !confirm('Offrir « ' + label + ' » et déduire ' + cost + ' XP ?')) return;
    try {
      const resp = await fetch('/api/profile?action=redeem-reward', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + $('password').value.trim() },
        body: JSON.stringify({ userId, rewardId, force }),
      });
      const data = await resp.json();
      if (resp.status === 409 && data.locked) {
        // Pas assez d'achats : on demande confirmation avant d'offrir quand même
        if (confirm('⚠️ ' + data.error + '\n\nLes XP viennent surtout de bonus (défi, coaching, parrainage…).\nOffrir « ' + label + ' » quand même ?')) {
          return redeemReward(userId, rewardId, label, cost, true);
        }
        return;
      }
      if (resp.ok) {
        showResult('ok', '🎁 « ' + esc(data.rewardLabel) + ' » offert ! −' + data.cost + ' XP. Nouveau total : ' + data.newXp + ' XP.');
        lookupUser(userId);
      } else {
        showResult('err', '❌ ' + esc(data.error || 'Erreur'));
      }
    } catch (err) {
      showResult('err', '❌ ' + esc(err && err.message ? err.message : err));
    }
  }

  // ─── Migration carte papier : crédit XP manuel (pas une vente) ─────
  async function creditXpManual(userId) {
    const xpAmount = parseInt(($('manualXp').value || '').trim(), 10);
    const reason = ($('manualReason').value || '').trim();
    if (!Number.isFinite(xpAmount) || xpAmount <= 0 || xpAmount > 100000) { alert('XP invalide (1 à 100000)'); return; }
    if (reason.length < 3) { alert('Raison requise (ex: « Carte papier 230 points »)'); return; }
    if (!confirm('Créditer ' + xpAmount + ' XP à ce client ?\n\nRaison : ' + reason + '\n\nCrédit manuel, pas une vente — ne touche pas au CA ni au nb de commandes.')) return;
    const btn = $('manualXpBtn');
    btn.disabled = true; btn.textContent = '…';
    try {
      const resp = await fetch('/api/profile?action=credit-xp-manual', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + $('password').value.trim() },
        body: JSON.stringify({ userId, xpAmount, reason }),
      });
      const data = await resp.json();
      if (resp.ok) {
        showResult('ok', '✅ +' + data.xpAdded + ' XP crédités manuellement. Nouveau total : ' + data.newXp + ' XP.');
        lookupUser(userId);
      } else {
        showResult('err', '❌ ' + esc(data.error || 'Erreur'));
        btn.disabled = false; btn.textContent = '📋 Créditer XP manuellement';
      }
    } catch (err) {
      showResult('err', '❌ ' + esc(err && err.message ? err.message : err));
      btn.disabled = false; btn.textContent = '📋 Créditer XP manuellement';
    }
  }

  // ─── Historique du client (commandes + points consommés) ──────────
  async function showClientHistory(userId) {
    const box = $('history-box');
    if (!box) return;
    if (box.dataset.open === '1') { box.innerHTML = ''; box.dataset.open = '0'; return; }
    box.innerHTML = '<div style="padding:12px 2px;color:var(--faint);font-size:12px;">Chargement de l\'historique…</div>';
    box.dataset.open = '1';
    try {
      const resp = await fetch('/api/orders?action=client-history&userId=' + encodeURIComponent(userId), {
        headers: { 'Authorization': 'Bearer ' + $('password').value.trim() },
      });
      const d = await resp.json();
      if (!resp.ok) { box.innerHTML = '<div style="color:var(--rose);font-size:12px;padding:8px 2px;">❌ ' + esc(d.error || 'Erreur') + '</div>'; return; }
      const fmt = (iso) => { const dt = new Date(iso); return isNaN(dt) ? '' : dt.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: '2-digit' }); };
      const orders = (d.orders || []).map((o) => {
        const items = (o.items || []).map((it) => (it.quantity > 1 ? it.quantity + '× ' : '') + esc(it.product_name)).join(', ');
        const eur = (o.total_cents / 100).toFixed(2).replace('.', ',');
        return '<div style="display:flex;justify-content:space-between;gap:8px;font-size:12.5px;padding:6px 0;border-bottom:1px solid rgba(13,148,136,.16);">' +
          '<span style="flex:1;min-width:0;"><b style="color:var(--dim);">' + fmt(o.paid_at || o.created_at) + '</b> · ' + (items || '<i style="color:var(--faint);">détail non dispo</i>') + '</span>' +
          '<span style="color:var(--teal-text);white-space:nowrap;">' + eur + '€</span></div>';
      }).join('');
      const reds = (d.rewards || []).map((r) =>
        '<div style="display:flex;justify-content:space-between;gap:8px;font-size:12.5px;padding:5px 0;">' +
          '<span>🎁 ' + esc(r.reward_label) + ' <span style="color:var(--faint);">(' + fmt(r.created_at) + ')</span></span>' +
          '<span style="color: var(--amber-text);white-space:nowrap;">−' + (r.xp_cost || 0) + ' XP</span></div>'
      ).join('');
      box.innerHTML =
        '<div style="margin-top:12px;border-top:1px solid rgba(13,148,136,.23);padding-top:10px;">' +
          '<div class="stat-label" style="margin-bottom:6px;">🧾 COMMANDES (' + (d.orders || []).length + ')</div>' +
          (orders || '<div style="font-size:12px;color:var(--faint);">Aucune commande.</div>') +
          (reds ? '<div class="stat-label" style="margin:12px 0 4px;color: var(--amber-text);">🎁 POINTS CONSOMMÉS</div>' + reds : '') +
        '</div>';
    } catch (err) {
      box.innerHTML = '<div style="color:var(--rose);font-size:12px;padding:8px 2px;">❌ ' + esc(err && err.message ? err.message : err) + '</div>';
    }
  }

  async function creditXP(userId, force = false) {
    const password = $('password').value.trim();
    const eurosRaw = $('amount').value.trim().replace(',', '.');
    const euros = parseFloat(eurosRaw);
    if (!Number.isFinite(euros) || euros <= 0) {
      alert('Montant invalide');
      return;
    }
    const amountCents = Math.round(euros * 100);

    // Remise/cadeau coché(e) → on l'envoie pour la marquer utilisée atomiquement.
    const selected = document.querySelector('input[name="applyReward"]:checked');
    const wheelSpinId = selected && selected.value ? selected.value : null;
    const combo = $('comboCheck') ? $('comboCheck').checked : false;
    const note = $('saleNote') ? $('saleNote').value.trim().slice(0, 120) : '';

    const btn = $('creditBtn');
    btn.disabled = true;
    btn.textContent = '…';
    try {
      const resp = await fetch('/api/profile?action=credit-manual', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + password },
        body: JSON.stringify({ userId, amountCents, paymentMethod: 'square_pos', wheelSpinId, combo, note, force }),
      });
      const data = await resp.json();
      if (resp.status === 409 && data.duplicate) {
        btn.disabled = false;
        btn.textContent = '✓ Encaisser & créditer XP';
        const again = confirm('⚠️ ' + data.error + '\n\nSi c\'est le MÊME achat : Annuler (sinon doublon de points).\nSi c\'est un AUTRE achat au même prix : OK pour créditer quand même.');
        if (again) return creditXP(userId, true);
        lookupUser(userId); // on réaffiche la fiche (passage déjà crédité = formulaire replié)
        return;
      }
      if (resp.ok) {
        lastCredit = { userId, xpGained: data.xpGained, newXp: data.newXp, amountCents, at: Date.now() };
        showResult('ok', '✅ +' + data.xpGained + ' XP crédités. Nouveau total : ' + data.newXp + ' XP.' + (wheelSpinId ? ' 🎟️ Remise marquée utilisée.' : ''));
        lookupUser(userId); // refresh
      } else {
        showResult('err', '❌ ' + esc(data.error || 'Erreur'));
        btn.disabled = false;
        btn.textContent = '✓ Encaisser & créditer XP';
      }
    } catch (err) {
      showResult('err', '❌ ' + esc(err.message));
      btn.disabled = false;
      btn.textContent = '✓ Encaisser & créditer XP';
    }
  }

  function showResult(kind, msg) {
    $('result').innerHTML = '<div class="' + kind + '">' + msg + '</div>';
  }
</script>
</body>
</html>
